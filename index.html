<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>무개성전대 OO레인저 — Flash Launcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.png" type="image/png" />

  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: "on",
      unmuteOverlay: "hidden",
      letterbox: "on",
      scale: "showAll",
      forceScale: true,
      quality: "high",
      wmode: "opaque"
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script>
    (function() {
      const onReady = () => {
        if (!window.RufflePlayer) {
          const s = document.createElement("script");
          s.src = "https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle";
          document.head.appendChild(s);
        }
      };
      document.readyState === "loading"
        ? document.addEventListener("DOMContentLoaded", onReady)
        : onReady();
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="particles" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="logo-block">
        <div class="logo-badge">
          <img src="favicon.png" alt="" />
        </div>
        <div class="logo-text">
          <span class="logo-title">무개성전대</span>
          <span class="logo-title accent">OO레인저</span>
        </div>
      </div>

      <nav class="controls">
        <p class="controls-label">CONTROLS</p>

        <button id="btnReload" class="ctrl-btn">
          <span class="ctrl-icon">↺</span>
          <span class="ctrl-text">다시 로드</span>
        </button>

        <button id="btnFullscreen" class="ctrl-btn">
          <span class="ctrl-icon">⛶</span>
          <span class="ctrl-text">전체화면</span>
        </button>

        <label class="ctrl-btn file-label" for="fileInput">
          <span class="ctrl-icon">⊕</span>
          <span class="ctrl-text">SWF 열기</span>
          <input id="fileInput" type="file" accept=".swf" />
        </label>
      </nav>

      <section class="guide-card">
        <p class="controls-label">KEY GUIDE</p>
        <p>게임 화면을 한 번 클릭한 뒤 조작하세요.</p>
        <p class="muted">키 입력은 Ruffle 플레이어로 강제 포커스 처리됩니다.</p>
      </section>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-left">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">초기화 중...</span>
        </div>
        <div class="topbar-right">
          <span class="badge">SWF</span>
          <span class="badge">600×330</span>
        </div>
      </div>

      <div class="stage-wrap">
        <div class="stage-corner tl"></div>
        <div class="stage-corner tr"></div>
        <div class="stage-corner bl"></div>
        <div class="stage-corner br"></div>

        <div id="stage" class="stage" aria-label="게임 무대" tabindex="0"></div>
        <div class="drop-overlay" id="dropOverlay" aria-hidden="true">
          <div class="drop-inner">
            <span class="drop-icon">⊕</span>
            <p>SWF 파일을 여기에 놓으세요</p>
          </div>
        </div>
      </div>

      <div class="bottombar">
        <details class="faq-inline">
          <summary>실행 안 될 때</summary>
          <div class="faq-body">
            <p><b>권장 실행</b> — 압축 해제 후 <code>실행.bat</code>로 실행하세요.</p>
            <p><b>직접 실행</b> — <code>file://</code>로 열면 브라우저 보안 정책 때문에 로딩이 멈출 수 있습니다.</p>
            <p><b>파일 경로</b> — <code>assets/freshman-oo-ranger.swf</code> 구조가 유지되어야 합니다.</p>
          </div>
        </details>
      </div>
    </main>
  </div>

  <script>
    const stage         = document.getElementById("stage");
    const fileInput     = document.getElementById("fileInput");
    const btnReload     = document.getElementById("btnReload");
    const btnFullscreen = document.getElementById("btnFullscreen");
    const dropOverlay   = document.getElementById("dropOverlay");
    const statusDot     = document.getElementById("statusDot");
    const statusText    = document.getElementById("statusText");
    const stageWrap     = document.querySelector(".stage-wrap");

    let rufflePlayer;
    let currentSrc = "assets/freshman-oo-ranger.swf";

    const GAME_WIDTH = 600;
    const GAME_HEIGHT = 330;
    const BLOCKED_KEYS = new Set([
      "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight",
      " ", "Spacebar", "Space", "Control", "Shift", "Alt",
      "z", "Z", "x", "X", "a", "A", "s", "S", "d", "D", "p", "P", "Enter"
    ]);

    function resizeStage() {
      const wrapRect = stageWrap.getBoundingClientRect();
      if (!wrapRect.width || !wrapRect.height) return;

      const scale = Math.min(wrapRect.width / GAME_WIDTH, wrapRect.height / GAME_HEIGHT);
      const safeScale = Math.max(0.01, scale);

      stage.style.width = GAME_WIDTH + "px";
      stage.style.height = GAME_HEIGHT + "px";
      stage.style.transform = `translate(-50%, -50%) scale(${safeScale})`;
    }

    function syncFullscreenButton() {
      const label = btnFullscreen.querySelector(".ctrl-text");
      if (!label) return;
      label.textContent = document.fullscreenElement ? "전체화면 종료" : "전체화면";
    }

    function setStatus(state, msg) {
      statusDot.className = "status-dot " + state;
      statusText.textContent = msg;
    }

    function escapeHtml(s) {
      return s
        .replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;");
    }

    function focusGame() {
      stage.focus({ preventScroll: true });
      if (rufflePlayer) {
        try { rufflePlayer.focus(); } catch (e) {}
        try { rufflePlayer.shadowRoot?.querySelector("canvas")?.focus(); } catch (e) {}
      }
    }

    function createPlayer() {
      stage.innerHTML = "";
      setStatus("loading", "로딩 중...");

      const ruffle = window.RufflePlayer?.newest?.();
      if (!ruffle) {
        stage.innerHTML = `
          <div class="error-state">
            <div class="error-code">ERR_RUFFLE_NOT_READY</div>
            <p>Ruffle 엔진을 초기화하는 중입니다.<br/>잠시 후 다시 시도해주세요.</p>
            <button class="retry-btn" onclick="createPlayer()">재시도</button>
          </div>`;
        setStatus("error", "Ruffle 미준비");
        return;
      }

      rufflePlayer = ruffle.createPlayer();
      rufflePlayer.setAttribute("tabindex", "0");
      rufflePlayer.style.cssText = "width:100%;height:100%;display:block;overflow:hidden;";
      stage.appendChild(rufflePlayer);
      resizeStage();

      rufflePlayer.load(currentSrc)
        .then(() => {
          setStatus("ok", "실행 중");
          requestAnimationFrame(focusGame);
          setTimeout(focusGame, 250);
        })
        .catch(err => {
          console.error(err);
          stage.innerHTML = `
            <div class="error-state">
              <div class="error-code">ERR_SWF_LOAD_FAILED</div>
              <p>SWF 파일을 불러올 수 없습니다.<br/>경로와 서버 구동 여부를 확인하세요.</p>
              <code class="error-detail">${escapeHtml(String(err))}</code>
              <button class="retry-btn" onclick="createPlayer()">재시도</button>
            </div>`;
          setStatus("error", "로드 실패");
        });
    }

    fileInput.addEventListener("change", e => {
      const file = e.target.files?.[0];
      if (!file) return;
      currentSrc = URL.createObjectURL(file);
      createPlayer();
    });

    stageWrap.addEventListener("dragover", e => {
      e.preventDefault();
      dropOverlay.classList.add("visible");
    });

    stageWrap.addEventListener("dragleave", e => {
      if (!stageWrap.contains(e.relatedTarget)) dropOverlay.classList.remove("visible");
    });

    stageWrap.addEventListener("drop", e => {
      e.preventDefault();
      dropOverlay.classList.remove("visible");
      const file = e.dataTransfer?.files?.[0];
      if (file?.name.toLowerCase().endsWith(".swf")) {
        currentSrc = URL.createObjectURL(file);
        createPlayer();
      }
    });

    btnReload.addEventListener("click", () => createPlayer());

    btnFullscreen.addEventListener("click", async () => {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await stageWrap.requestFullscreen?.();
        }
      } catch (err) {
        console.warn("Fullscreen request failed:", err);
      } finally {
        syncFullscreenButton();
        resizeStage();
        focusGame();
      }
    });

    ["pointerdown", "mousedown", "click", "touchstart"].forEach(type => {
      stageWrap.addEventListener(type, focusGame, { passive: true });
    });

    window.addEventListener("keydown", e => {
      if (document.activeElement === fileInput) return;
      if (BLOCKED_KEYS.has(e.key)) {
        e.preventDefault();
        focusGame();
      }
    }, { capture: true });

    window.addEventListener("resize", resizeStage);
    document.addEventListener("fullscreenchange", () => {
      syncFullscreenButton();
      requestAnimationFrame(resizeStage);
      setTimeout(resizeStage, 80);
      setTimeout(focusGame, 120);
    });

    if ("ResizeObserver" in window) {
      new ResizeObserver(() => resizeStage()).observe(stageWrap);
    }

    document.addEventListener("DOMContentLoaded", () => {
      resizeStage();
      createPlayer();
    });

    window.createPlayer = createPlayer;
  </script>
</body>
</html>
